<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ameublement Gilly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
html, body { margin: 0; }
[hidden] { display: none !important; }

/* Layout: one narrow column, a ledger. Summary, then the list grouped by room, form at the bottom. Monochrome on white, by request. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #6b6b6b;
  --faint: #a3a3a3;
  --line: #e6e6e6;
  --soft: #f5f5f5;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}
header { display: flex; flex-direction: column; gap: 4px; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Summary */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--fg); border-bottom: 1px solid var(--line); }
.stat { padding: 14px 12px 14px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat + .stat { padding-left: 12px; border-left: 1px solid var(--line); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.stat .value { font-size: 20px; font-weight: 500; white-space: nowrap; }
.stat.reste .value { font-weight: 600; }
.budget-edit { display: flex; align-items: center; gap: 6px; }
.budget-edit button { padding: 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; }
.budget-edit input { width: 100px; }
.bar { height: 4px; background: var(--soft); position: relative; overflow: hidden; }
.bar span { position: absolute; inset: 0 auto 0 0; background: var(--fg); }
.bar span.planned { background: var(--faint); }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 4px; vertical-align: middle; margin-right: 6px; background: var(--fg); }
.legend i.p { background: var(--faint); }
.over { color: var(--fg); font-weight: 600; }

/* List */
.group { display: flex; flex-direction: column; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--fg); }
.group-head h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin: 0; }
.group-head .num { font-size: 13px; color: var(--muted); }
.row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row .name { font-weight: 500; overflow-wrap: anywhere; }
.row .meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.row .meta a { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
.row .price { text-align: right; white-space: nowrap; }
.row.done .name { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted); }
.row.done .price { color: var(--muted); }
.check { width: 18px; height: 18px; accent-color: #111111; cursor: pointer; margin: 0; }
.del { border: 0; background: none; color: var(--faint); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 0; min-width: 64px; text-align: right; }
.del:hover, .del:focus-visible { color: var(--fg); }
.del.armed { color: var(--fg); font-weight: 600; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }

.empty { color: var(--muted); padding: 24px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.status { font-size: 13px; color: var(--muted); min-height: 20px; }

/* Form */
form { display: flex; flex-direction: column; gap: 16px; padding-top: 16px; border-top: 1px solid var(--fg); }
form h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin: 0; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
label { font-size: 12px; color: var(--muted); }
input, select {
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding: 8px 0;
  width: 100%;
  min-width: 0;
}
input:focus, select:focus { outline: none; border-bottom-color: var(--fg); }
.radios { display: flex; gap: 20px; padding: 8px 0; }
.radios label { color: var(--fg); font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.radios input { width: auto; accent-color: #111111; }
.actions { display: flex; gap: 16px; align-items: center; }
.btn { font: inherit; font-weight: 500; background: var(--fg); color: var(--bg); border: 1px solid var(--fg); padding: 10px 20px; cursor: pointer; border-radius: 0; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-ghost { background: var(--bg); color: var(--fg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.readonly-note { font-size: 13px; color: var(--muted); }

@media (max-width: 560px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { padding-left: 0; border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: 24px minmax(0, 1fr) auto; }
  .row .del { grid-column: 2 / -1; text-align: left; min-width: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar span { transition: width .3s ease; }
}

.gate { display: flex; flex-direction: column; gap: 16px; max-width: 360px; padding-top: 16px; border-top: 1px solid var(--fg); }
.gate p { margin: 0; color: var(--muted); font-size: 14px; }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; font-size: 13px; color: var(--muted); text-decoration: underline; cursor: pointer; align-self: flex-start; }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ameublement — Chaussée de Ransart 222/101</h1>
    <p class="sub">Entrée le 16 janvier 2027 · Linton &amp; Pauline</p>
  </header>

  <form class="gate" id="gate" autocomplete="off" hidden>
    <p>Entre le code secret pour ouvrir la liste. Il est demandé une seule fois sur cet appareil.</p>
    <div class="field"><label for="g-code">Code</label><input id="g-code" class="num" autocapitalize="characters" required></div>
    <div class="actions"><button class="btn" type="submit" id="g-submit">Ouvrir</button><span class="status" id="g-status"></span></div>
  </form>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:40px">
    <section aria-label="Résumé du budget">
      <div class="summary">
        <div class="stat">
          <span class="label">Budget</span>
          <span class="value num" id="v-budget">—</span>
          <span class="budget-edit" id="budget-edit"></span>
        </div>
        <div class="stat"><span class="label">Acheté</span><span class="value num" id="v-done">—</span></div>
        <div class="stat"><span class="label">Prévu</span><span class="value num" id="v-planned">—</span></div>
        <div class="stat reste"><span class="label">Reste</span><span class="value num" id="v-left">—</span></div>
      </div>
      <div class="bar" aria-hidden="true"><span class="planned" id="bar-planned" style="width:0"></span><span id="bar-done" style="width:0"></span></div>
      <div class="legend"><span><i></i>Acheté</span><span><i class="p"></i>Prévu</span><span id="pct"></span></div>
    </section>

    <section aria-label="Liste des achats">
      <div class="status" id="status" role="status"></div>
      <div id="list"></div>
    </section>

    <form id="add-form" autocomplete="off">
      <h2>Ajouter un achat</h2>
      <div class="fields">
        <div class="field wide"><label for="f-name">Article</label><input id="f-name" required placeholder="Meuble TV"></div>
        <div class="field"><label for="f-price">Prix (€)</label><input id="f-price" class="num" inputmode="decimal" required placeholder="149,99"></div>
        <div class="field"><label for="f-store">Magasin</label><input id="f-store" placeholder="IKEA, Electro Dépôt…"></div>
        <div class="field"><label for="f-cat">Pièce</label>
          <select id="f-cat">
            <option>Salon</option><option>Cuisine</option><option>Chambre</option><option>Salle de bain</option><option>Électroménager</option><option>Divers</option>
          </select>
        </div>
        <div class="field"><label>Statut</label>
          <div class="radios">
            <label><input type="radio" name="f-status" id="f-st-planned" value="planned" checked>Prévu</label>
            <label><input type="radio" name="f-status" id="f-st-done" value="done">Acheté</label>
          </div>
        </div>
        <div class="field wide"><label for="f-link">Lien (facultatif)</label><input id="f-link" type="url" inputmode="url" placeholder="https://"></div>
      </div>
      <div class="actions">
        <button class="btn" type="submit" id="f-submit">Ajouter</button>
        <span class="status" id="form-status"></span>
      </div>
    </form>
  </div>
</div>
<script>
(function () {
  "use strict";
  var API = "https://gdenkygewitokuihvjrs.supabase.co/rest/v1/rpc/";
  var KEY = "sb_publishable_l3LP8JGPSRGADQ-ZZXaynA_6VP2QccH";
  var STORE_KEY = "ameublement-gilly-code";
  var ACCESS_CODE = "3RJAZ5BE";
  var CATS = ["Salon", "Cuisine", "Chambre", "Salle de bain", "Électroménager", "Divers"];
  var fmt = new Intl.NumberFormat("fr-BE", { style: "currency", currency: "EUR" });
  var state = { budget: null, items: [], code: null };
  var armedId = null, armTimer = null, pollTimer = null;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function money(n) { return fmt.format(Math.round((Number(n) || 0) * 100) / 100); }
  function parsePrice(s) {
    var v = String(s || "").replace(/\s/g, "").replace("€", "").replace(",", ".");
    if (v === "") return NaN;
    var n = Number(v);
    return isFinite(n) && n >= 0 && n < 1000000 ? Math.round(n * 100) / 100 : NaN;
  }
  function safeUrl(u) { try { var x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null; } catch (e) { return null; } }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return "lien"; } }
  function store(get, val) {
    try { if (get) return localStorage.getItem(STORE_KEY); if (val == null) localStorage.removeItem(STORE_KEY); else localStorage.setItem(STORE_KEY, val); } catch (e) { return null; }
  }

  async function rpc(fn, args) {
    var res = await fetch(API + fn, {
      method: "POST",
      headers: { "apikey": KEY, "Content-Type": "application/json" },
      body: JSON.stringify(args)
    });
    var text = await res.text();
    var data = null; try { data = text ? JSON.parse(text) : null; } catch (e) {}
    if (!res.ok) {
      var msg = (data && (data.message || data.hint)) || "";
      var err = new Error(msg || ("HTTP " + res.status));
      err.code = /invalid_code/.test(msg) ? "invalid_code" : /too_many_items/.test(msg) ? "full" : "error";
      throw err;
    }
    return data;
  }

  /* ---------- rendering ---------- */
  function renderSummary() {
    var budget = Number(state.budget) || 0, done = 0, planned = 0;
    state.items.forEach(function (it) { if (it.status === "done") done += it.price; else planned += it.price; });
    var left = budget - done - planned;
    $("v-budget").textContent = state.budget == null ? "—" : money(budget);
    $("v-done").textContent = money(done);
    $("v-planned").textContent = money(planned);
    $("v-left").textContent = state.budget == null ? "—" : money(left);
    $("v-left").classList.toggle("over", left < 0);
    var pd = budget > 0 ? Math.min(100, done / budget * 100) : 0;
    var pp = budget > 0 ? Math.min(100, (done + planned) / budget * 100) : 0;
    $("bar-done").style.width = pd + "%";
    $("bar-planned").style.width = pp + "%";
    $("pct").textContent = budget > 0 ? (left < 0 ? "Dépassement de " + money(-left) : Math.round(pp) + " % du budget engagé") : "";
  }

  function renderList() {
    var list = $("list"); list.textContent = "";
    if (!state.items.length) { list.appendChild(el("p", "empty", "Aucun achat pour l'instant. Ajoute le premier avec le formulaire ci-dessous.")); return; }
    var groups = {};
    state.items.forEach(function (it) { (groups[it.category] = groups[it.category] || []).push(it); });
    var order = CATS.concat(Object.keys(groups).filter(function (c) { return CATS.indexOf(c) < 0; }));
    var wrap = el("div"); wrap.style.display = "flex"; wrap.style.flexDirection = "column"; wrap.style.gap = "28px";
    order.forEach(function (cat) {
      var items = groups[cat]; if (!items) return;
      items.sort(function (a, b) { return (a.status === b.status ? 0 : a.status === "done" ? 1 : -1) || (a.createdAt - b.createdAt); });
      var g = el("div", "group"), head = el("div", "group-head");
      head.appendChild(el("h2", null, cat));
      head.appendChild(el("span", "num", money(items.reduce(function (s, i) { return s + i.price; }, 0))));
      g.appendChild(head);
      items.forEach(function (it) {
        var row = el("div", "row" + (it.status === "done" ? " done" : ""));
        var cb = el("input", "check"); cb.type = "checkbox"; cb.id = "cb-" + it.id; cb.checked = it.status === "done";
        cb.setAttribute("aria-label", "Marquer « " + it.name + " » comme acheté");
        cb.addEventListener("change", function () { toggle(it, cb); });
        row.appendChild(cb);
        var mid = el("div"); mid.style.minWidth = "0";
        mid.appendChild(el("div", "name", it.name));
        var meta = el("div", "meta");
        meta.appendChild(el("span", "tag", it.status === "done" ? "Acheté" : "Prévu"));
        if (it.store) meta.appendChild(el("span", null, it.store));
        var u = it.link && safeUrl(it.link);
        if (u) { var a = el("a", null, host(u)); a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; meta.appendChild(a); }
        mid.appendChild(meta); row.appendChild(mid);
        row.appendChild(el("div", "price num", money(it.price)));
        var del = el("button", "del", armedId === it.id ? "Confirmer" : "Retirer"); del.type = "button";
        if (armedId === it.id) del.classList.add("armed");
        del.addEventListener("click", function () { remove(it); });
        row.appendChild(del);
        g.appendChild(row);
      });
      wrap.appendChild(g);
    });
    list.appendChild(wrap);
  }

  function render() { renderSummary(); renderList(); }

  /* ---------- data ---------- */
  function applyState(data) {
    state.budget = data && data.budget != null ? Number(data.budget) : null;
    state.items = ((data && data.items) || []).map(function (x) {
      return {
        id: String(x.id), name: String(x.name || "Sans nom"), price: Number(x.price) || 0,
        store: x.store ? String(x.store) : "", category: x.category ? String(x.category) : "Divers",
        status: x.status === "done" ? "done" : "planned", link: x.link ? String(x.link) : "",
        createdAt: Date.parse(x.created_at) || 0
      };
    });
    render();
  }

  async function refresh(quiet) {
    try {
      applyState(await rpc("app_state", { p_code: state.code }));
      $("status").textContent = "";
    } catch (e) {
      if (!quiet) $("status").textContent = "La liste n'a pas pu être chargée. Vérifie ta connexion.";
    }
  }

  async function toggle(it, cb) {
    cb.disabled = true;
    try { await rpc("app_set_status", { p_code: state.code, p_id: it.id, p_status: cb.checked ? "done" : "planned" }); await refresh(); }
    catch (e) { cb.checked = !cb.checked; writeError(e); }
    cb.disabled = false;
  }

  async function remove(it) {
    if (armedId !== it.id) {
      armedId = it.id; clearTimeout(armTimer);
      armTimer = setTimeout(function () { armedId = null; renderList(); }, 4000);
      renderList(); return;
    }
    armedId = null; clearTimeout(armTimer);
    try { await rpc("app_delete_item", { p_code: state.code, p_id: it.id }); await refresh(); }
    catch (e) { writeError(e); renderList(); }
  }

  function writeError(e) {
    $("form-status").textContent = e.code === "full" ? "La liste est pleine : retire des articles avant d'en ajouter." : "L'enregistrement a échoué. Réessaie dans un instant.";
  }

  $("add-form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var name = $("f-name").value.trim(), price = parsePrice($("f-price").value);
    if (!name) { $("form-status").textContent = "Indique le nom de l'article."; return; }
    if (isNaN(price)) { $("form-status").textContent = "Le prix doit être un nombre, par exemple 149,99."; return; }
    var raw = $("f-link").value.trim(), link = raw ? safeUrl(raw) : "";
    if (raw && !link) { $("form-status").textContent = "Le lien doit commencer par https://"; return; }
    $("f-submit").disabled = true;
    try {
      await rpc("app_add_item", {
        p_code: state.code, p_name: name.slice(0, 120), p_price: price,
        p_store: $("f-store").value.trim().slice(0, 60), p_category: $("f-cat").value,
        p_status: $("f-st-done").checked ? "done" : "planned", p_link: link || ""
      });
      $("f-name").value = ""; $("f-price").value = ""; $("f-store").value = ""; $("f-link").value = "";
      $("f-st-planned").checked = true;
      $("form-status").textContent = "Ajouté.";
      setTimeout(function () { $("form-status").textContent = ""; }, 2500);
      await refresh();
      $("f-name").focus();
    } catch (e) { writeError(e); }
    $("f-submit").disabled = false;
  });

  function showBudgetButton() {
    var box = $("budget-edit"); box.textContent = "";
    var b = el("button", null, "Modifier"); b.type = "button"; b.id = "budget-btn";
    b.addEventListener("click", openBudgetEditor); box.appendChild(b);
  }
  function openBudgetEditor() {
    var box = $("budget-edit"); box.textContent = "";
    var inp = el("input", "num"); inp.id = "budget-input"; inp.inputMode = "decimal";
    inp.value = state.budget != null ? String(state.budget).replace(".", ",") : "";
    inp.setAttribute("aria-label", "Nouveau budget en euros");
    var ok = el("button", null, "OK"); ok.type = "button";
    box.appendChild(inp); box.appendChild(ok); inp.focus();
    var busy = false;
    async function save() {
      if (busy) return; busy = true;
      var n = parsePrice(inp.value);
      if (!isNaN(n) && n !== state.budget) {
        try { await rpc("app_set_budget", { p_code: state.code, p_amount: n }); await refresh(); } catch (e) { writeError(e); }
      }
      showBudgetButton();
    }
    ok.addEventListener("click", save);
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); save(); }
      if (e.key === "Escape") showBudgetButton();
    });
  }

  /* ---------- access ---------- */
  function lock(msg) {
    clearInterval(pollTimer); state.code = null; store(false, null);
    $("app").hidden = true; $("gate").hidden = false;
    $("g-status").textContent = msg || ""; $("g-code").value = ""; $("g-code").focus();
  }
  async function unlock(code, fromGate) {
    $("g-submit").disabled = true;
    try {
      var data = await rpc("app_state", { p_code: code });
      state.code = code; store(false, code);
      $("gate").hidden = true; $("app").hidden = false;
      showBudgetButton(); applyState(data);
      clearInterval(pollTimer);
      pollTimer = setInterval(function () { if (!document.hidden) refresh(true); }, 15000);
    } catch (e) {
      $("app").hidden = false; $("status").textContent = "Impossible de charger la liste. Vérifie ta connexion et recharge la page.";
    }
    $("g-submit").disabled = false;
  }

  $("gate").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var code = $("g-code").value.trim().toUpperCase();
    if (code) unlock(code, true);
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && state.code) refresh(true); });

  // Accès direct, sans code à taper : la page utilise le code d'accès de la base automatiquement.
  unlock(ACCESS_CODE, false);
})();

</script>
</body>
</html>
